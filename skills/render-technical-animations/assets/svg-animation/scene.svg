<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="scene-title scene-description" xml:lang="en" data-duration="8">
  <title id="scene-title">A request moves from source to processor to result</title>
  <desc id="scene-description">An illustrative eight-second loop: the source holds a request, sends it to the processor, and receives a completed result. Reduced-motion mode shows the completed state.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
    .context { font-size: 16px; fill: #526579; }
    .label { font-size: 20px; font-weight: 600; }
    .state, .note { font-size: 16px; fill: #526579; }
    .step-title { font-size: 20px; font-weight: 600; }
    .connector { fill: none; stroke: #a3b2c2; stroke-width: 2; }
    .token rect { fill: #eaf2ff; stroke: #7296c2; stroke-width: 1.5; }
    .token text { font: 600 17px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .poster { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .animated { display: none; }
      .poster { display: inline; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#a3b2c2"/>
    </marker>
  </defs>
  <rect width="1100" height="430" fill="white"/>
  <text x="60" y="34" class="context">One request · illustrative timing</text>
  <path class="connector" d="M300 194 H423" marker-end="url(#arrow)"/>
  <path class="connector" d="M670 194 H793" marker-end="url(#arrow)"/>
  <rect x="60" y="70" width="240" height="190" rx="10" fill="#f0f6ff" stroke="#a7bddc" stroke-width="1.5"/>
  <rect x="430" y="70" width="240" height="190" rx="10" fill="#faf7fd" stroke="#c5b2db" stroke-width="1.5"/>
  <rect x="800" y="70" width="240" height="190" rx="10" fill="#eff8f3" stroke="#a3c9b5" stroke-width="1.5"/>
  <text x="180" y="112" class="label" text-anchor="middle">Source</text>
  <text x="550" y="112" class="label" text-anchor="middle">Processor</text>
  <text x="920" y="112" class="label" text-anchor="middle">Result</text>
  <path d="M60 298 H1040" stroke="#dce4ec"/>
  <g class="animated">
    <text id="state-ready" x="550" y="150" class="state" text-anchor="middle" opacity="1">Ready
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.375;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </text>
    <text id="state-running" x="550" y="150" class="state" text-anchor="middle" opacity="0">Running
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.375;0.625;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </text>
    <text id="state-complete" x="550" y="150" class="state" text-anchor="middle" opacity="0">Complete
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.625;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </text>
    <g id="request-token" class="token" transform="translate(180 194)">
      <animateTransform attributeName="transform" type="translate" values="180 194;180 194;550 194;550 194;920 194;920 194" keyTimes="0;0.125;0.375;0.625;0.875;1" dur="8s" repeatCount="indefinite"/>
      <rect x="-24" y="-20" width="48" height="40" rx="6"/>
      <text text-anchor="middle" y="6">01</text>
    </g>
    <g id="step-ready" opacity="1">
      <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.125;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <text x="60" y="350" class="step-title">Ready to send</text>
      <text x="60" y="386" class="note">The source has one request.</text>
    </g>
    <g id="step-inbound" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.125;0.375;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <text x="60" y="350" class="step-title">Request in transit</text>
      <text x="60" y="386" class="note">The request moves from the source to the processor.</text>
    </g>
    <g id="step-processing" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.375;0.625;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <text x="60" y="350" class="step-title">Processing</text>
      <text x="60" y="386" class="note">The processor handles the request.</text>
    </g>
    <g id="step-outbound" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.625;0.875;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <text x="60" y="350" class="step-title">Result in transit</text>
      <text x="60" y="386" class="note">Processing is complete. The result moves to the destination.</text>
    </g>
    <g id="step-complete" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.875;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <text x="60" y="350" class="step-title">Result received</text>
      <text x="60" y="386" class="note">The request has completed. The illustration repeats.</text>
    </g>
  </g>
  <g class="poster">
    <text x="550" y="150" class="state" text-anchor="middle">Complete</text>
    <g class="token" transform="translate(920 194)">
      <rect x="-24" y="-20" width="48" height="40" rx="6"/>
      <text text-anchor="middle" y="6">01</text>
    </g>
    <text x="60" y="350" class="step-title">Result received</text>
    <text x="60" y="386" class="note">The request has completed. Static view for reduced motion.</text>
  </g>
</svg>
